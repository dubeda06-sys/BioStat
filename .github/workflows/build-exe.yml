name: Compilar BioStat.exe

# Se dispara solo al etiquetar una versión (v1.2.2, v1.3.0, ...) o a mano desde
# la pestaña Actions -> «Compilar BioStat.exe» -> Run workflow.
# Con etiqueta, el .exe queda adjunto al Release; con disparo manual queda como
# artefacto descargable de esa corrida (se conserva 30 días).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # crear el Release y subirle el .exe

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial y etiquetas: la identidad del build sale de git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Pruebas
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Compilar
        shell: pwsh
        run: python build_exe.py

      - name: Comprobar que el .exe existe y calcular su huella
        shell: pwsh
        run: |
          $exe = "dist\BioStat.exe"
          if (-not (Test-Path $exe)) { throw "No se generó $exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "BioStat.exe: $mb MB"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  BioStat.exe" | Out-File -Encoding ascii dist\BioStat.exe.sha256
          Get-Content dist\BioStat.exe.sha256

      - name: Prueba de humo (el .exe arranca y no se cae)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\BioStat.exe" -PassThru
          Start-Sleep -Seconds 40
          if ($p.HasExited) { throw "BioStat.exe se cerró solo (código $($p.ExitCode)): falta algún módulo en el empaquetado." }
          Write-Host "BioStat.exe sigue corriendo tras 40 s."
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: BioStat-windows
          path: |
            dist/BioStat.exe
            dist/BioStat.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Adjuntar al Release (solo con etiqueta)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "BioStat $tag" --generate-notes
          }
          gh release upload $tag dist\BioStat.exe dist\BioStat.exe.sha256 --clobber
